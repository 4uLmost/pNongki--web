<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Tempat</title>
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/tambah-tempat.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <h1>p<span>NONGKI!</span></h1>
            <nav>
                <ul>
                    <li><a href="landing-page.html">Home</a></li>
                    <li><a href="#tambah-tempat" class="nav-active">tambah tempat</a></li>
                    <li><a href="detail.html">Detail</a></li>
                </ul>
            </nav>
            <div class="login-nav">
                <div>
                    <p>Notifikasi</p>
                </div>
                <div>
                    <p>Login</p>
                </div>
            </div>
        </div>
    </header>

    <main class="container main-container">
        <section class="form-card">
            <h2>Daftarkan Tempat Baru</h2>
            <p class="form-desc">Bantu kami melengkapi direktori tempat nongkrong dan olahraga di Bandung dengan mengisi formulir di bawah ini.</p>
            
            <form action="#" method="POST" class="add-place-form">
                <div class="form-group">
                    <label for="nama_tempat">Nama Tempat:</label>
                    <input type="text" id="nama_tempat" name="nama_tempat" placeholder="Contoh: Kopi Anjis, Lapangan Gasibu" required>
                </div>
                
                <div class="form-group">
                    <label for="kategori">Kategori:</label>
                    <select id="kategori" name="kategori">
                        <option value="warkop">Tempat Makan / Warkop</option>
                        <option value="olahraga">Olahraga / Jogging</option>
                        <option value="taman">Taman / Bersantai</option>
                        <option value="lainnya">Lainnya</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="alamat">Alamat Lengkap:</label>
                    <textarea id="alamat" name="alamat" rows="3" placeholder="Masukkan alamat lengkap..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="jam_buka">Jam Operasional (Contoh: 08:00 - 22:00):</label>
                    <input type="text" id="jam_buka" name="jam_buka" placeholder="08:00 - 22:00">
                </div>
                
                <div class="form-group">
                    <label for="file_foto">Foto Tempat:</label>
                    <input type="file" id="file_foto" name="file_foto" accept="image/*">
                </div>
                
                <div class="form-group">
                    <label for="deskripsi">Deskripsi Singkat:</label>
                    <textarea id="deskripsi" name="deskripsi" rows="5" placeholder="Ceritakan suasana atau keunikan tempat..." required></textarea>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn-submit">Simpan Rekomendasi</button>
                    <button type="reset" class="btn-reset">Batal</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Bandung p<span>NONGKI!</span>. ex-regol</p>
    </footer>
</body>
</html>
